; ESP32 Honeypot v2 — build configuration
;
;   pio run -e esp32s3 -t upload && pio device monitor
;
; The UI is compiled into the firmware (src/ui_index.h, generated from
; ui/index.html by tools/gen_ui.py) so there is no separate filesystem
; upload step. LittleFS holds only config + captured events.

[env]
framework      = arduino
extra_scripts  = pre:tools/gen_ui.py
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps       = bblanchon/ArduinoJson @ ^7.0.4
                 adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DHP_VERSION=\"2.0.0\"
    -Wall -Wextra -Wno-unused-parameter

; --- ESP32-S3 N16R8 (16 MB flash, 8 MB PSRAM) — the attached board ---------
; pio run -e esp32s3 -t upload --upload-port /dev/ttyACM1
[env:esp32s3]
platform   = espressif32 @ ^6.6.0
board      = esp32-s3-devkitc-1
board_build.partitions   = partitions_16mb.csv
board_build.flash_mode   = qio
board_upload.flash_size  = 16MB
board_upload.maximum_size = 4194304
; N16R8 modules carry *octal* PSRAM. Leaving this at the quad default makes the
; chip report "PSRAM not found" and the event ring silently falls back to heap.
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DHP_STATUS_LED_PIN=48
    -DHP_STATUS_LED_RGB=1

; pio run -e seeed_xiao_esp32s3 -t upload --upload-port /dev/ttyACM1
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DHP_STATUS_LED_PIN=21
    -DHP_STATUS_LED_RGB=0

; --- Classic ESP32 dev board (4 MB) ---------------------------------------
[env:esp32dev]
platform = espressif32 @ ^6.6.0
board    = esp32dev
board_build.partitions = min_spiffs.csv

; --- M5Stack AtomS3 (4 MB, no PSRAM) --------------------------------------
[env:atoms3]
platform = espressif32 @ ^6.6.0
board    = m5stack-atoms3
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DHP_STATUS_LED_PIN=35
    -DHP_STATUS_LED_RGB=1

; NOTE: ESP32-C6 (NanoC6) and C5 need Arduino core 3.x. Use the pioarduino
; platform fork instead of espressif32 6.x:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
